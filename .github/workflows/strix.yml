name: strix-penetration-test
on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 3 * * 1"  # weekly Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: strix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Strix (diff scan on PRs, full on schedule)
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM || 'openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || 'https://openrouter.ai/api/v1' }}
        run: |
          export PATH="$HOME/.strix/bin:$PATH"
          # Quick diff scan on PRs (auto-scoped to changed files), standard on weekly schedule
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            strix -n -t ./ --scan-mode quick --scope-mode diff --diff-base origin/${{ github.base_ref }}
          else
            strix -n -t ./ --scan-mode standard
          fi

      - name: Upload Strix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-results
          path: strix_runs/
          retention-days: 30
