name: Keep-alive + reminder tick

# Runs on a schedule and does two things in one request:
#   1. Wakes the backend — Render's free plan sleeps a web service after ~15 min
#      of no inbound traffic, and our medicine-reminder scheduler sleeps with it.
#   2. Drives the reminder tick — if a CRON_SECRET repo secret is set, it POSTs
#      to /api/push/run-tick so due reminders are delivered on THIS request,
#      even if the in-process scheduler had been asleep. The server's 10-minute
#      catch-up window covers the gap between runs.
#
# Without CRON_SECRET it falls back to a plain /health ping (keep-alive only).
#
# Reliability note: GitHub's scheduled runs are best-effort and can be delayed
# several minutes. For minute-accurate reminders, ALSO point a free external
# cron at the same run-tick URL every 1 minute (cron-job.org, UptimeRobot):
#   POST https://<host>/api/push/run-tick   header  X-Cron-Secret: <secret>
#
# Override the target host without editing this file by setting a repo Actions
# *variable* named HEALTHCHECK_URL (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (GitHub's practical minimum)
  workflow_dispatch: {}        # manual trigger from the Actions tab

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake backend and run reminder tick
        env:
          BASE_URL: ${{ vars.HEALTHCHECK_URL || 'https://medistore-api-vwyr.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          echo "Target: $BASE_URL"
          # Retry a few times: a cold Render instance can take 30-60s to wake.
          for attempt in 1 2 3 4 5; do
            if [ -n "${CRON_SECRET:-}" ]; then
              code="$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 60 \
                -X POST -H "X-Cron-Secret: $CRON_SECRET" "$BASE_URL/api/push/run-tick" || echo 000)"
              echo "Attempt $attempt (run-tick) -> HTTP $code"
            else
              code="$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 60 "$BASE_URL/health" || echo 000)"
              echo "Attempt $attempt (health) -> HTTP $code"
            fi
            if [ "$code" = "200" ]; then
              echo "OK:"; cat /tmp/out; echo
              exit 0
            fi
            sleep 15
          done
          echo "Failed after retries. Last body:"; cat /tmp/out || true
          exit 1
