<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — MediStore</title>
  <style>
    :root { --primary: #2563EB; --bg: #F9FAFB; --text: #111827; --sub: #6B7280; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px;
    }
    .card { text-align: center; max-width: 360px; }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; background: var(--primary);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; font-weight: 700;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--sub); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button {
      background: var(--primary); color: #fff; border: 0; border-radius: 10px;
      padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">+</div>
    <h1>You're offline</h1>
    <p>MediStore needs an internet connection to load your medical records. Please reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
