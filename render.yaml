# Render Blueprint for the MediStore backend (FastAPI).
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this repo to GitHub (already on origin: Susandhungana1/Medicare).
#   2. On render.com: New > Blueprint > pick this repo. Render reads this file.
#   3. Fill the secret env vars marked `sync: false` (they are NOT in git).
#
# The free plan gives HTTPS + a *.onrender.com domain automatically. Free web
# services sleep after ~15 min idle (cold start on next request) — fine for a
# pilot; upgrade to keep it warm.
services:
  - type: web
    name: medistore-api
    # Docker runtime so the image can install the `tesseract` OCR binary that
    # pytesseract needs (the native python runtime can't apt-install it, which
    # broke image/scanned-PDF report extraction in prod). Build + start come
    # from server/Dockerfile, so no build/startCommand here.
    runtime: docker
    plan: free
    region: singapore          # closest Render region to Nepal / ap-northeast
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Non-secret config — safe to keep in git.
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: medistore-files
      - key: S3_REGION
        value: ap-northeast-1
      - key: S3_ENDPOINT_URL
        value: https://xifuewqueggghsdipmgf.storage.supabase.co/storage/v1/s3
      # Secrets — set these in the Render dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Frontend origin(s) for CORS — set once the frontend is deployed.
      # Comma-separated, e.g. https://medistore.vercel.app
      - key: CORS_ORIGINS
        sync: false