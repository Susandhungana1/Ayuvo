# Render Blueprint for the Ayuvo backend (FastAPI).
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this repo to GitHub (already on origin: Susandhungana1/Medicare).
#   2. On render.com: New > Blueprint > pick this repo. Render reads this file.
#   3. Fill the secret env vars marked `sync: false` (they are NOT in git).
#
# IMPORTANT — env vars here are applied when the service is CREATED from this
# blueprint, not on every push. Adding a new `- key:` below and pushing does
# NOT create it on the running service: the code deploys, the variable stays
# absent, and the app silently falls back to its default. This cost an hour on
# 2026-08-03 with CARETAKER_ENABLED, which read `false` in production while
# this file said "true".
#
# So: after adding any variable here, also add it by hand in
# Render > ayuvo-api > Environment. Treat this file as documentation of
# what the service needs, not as something that configures it in place.
#
# The free plan gives HTTPS + a *.onrender.com domain automatically. Free web
# services sleep after ~15 min idle (cold start on next request) — fine for a
# pilot; upgrade to keep it warm.
services:
  - type: web
    name: ayuvo-api
    # Docker runtime so the image can install the `tesseract` OCR binary that
    # pytesseract needs (the native python runtime can't apt-install it, which
    # broke image/scanned-PDF report extraction in prod). Build + start come
    # from server/Dockerfile, so no build/startCommand here.
    runtime: docker
    plan: free
    region: singapore          # closest Render region to Nepal / ap-northeast
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Non-secret config — safe to keep in git.
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: medistore-files
      - key: S3_REGION
        value: ap-northeast-1
      - key: S3_ENDPOINT_URL
        value: https://xifuewqueggghsdipmgf.storage.supabase.co/storage/v1/s3
      # Secrets — set these in the Render dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Web Push (medicine reminders when the app is closed).
      # The PUBLIC key is not a secret — browsers receive it — so it's committed
      # here; this also guarantees it matches the private key. Set the matching
      # VAPID_PRIVATE_KEY in the dashboard (sync:false). To rotate, regenerate a
      # pair (`npx web-push generate-vapid-keys`) and update BOTH together.
      # NOTE: the free plan sleeps after ~15 min idle and the in-process reminder
      # scheduler sleeps with it. To deliver reliably anyway, set CRON_SECRET
      # (below) and have a cron POST /api/push/run-tick every minute — that wakes
      # the instance AND flushes due reminders. The keep-alive GitHub Action
      # (.github/workflows/keepalive.yml) does this every 5 min out of the box;
      # add a free cron-job.org / UptimeRobot hit at 1 min for minute accuracy.
      - key: VAPID_PUBLIC_KEY
        value: BERDuKJaoYAjfFSDTLbMLztfcx59zTeDZUYo6tu9T04BuPtcNn2b7JR0aCpZ0fkKq4cyiEVimBYFqLvBaFXbpgw
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@ayuvo.app
      # Shared secret guarding POST /api/push/run-tick (external reminder cron).
      # Generate any long random string; set the SAME value as the CRON_SECRET
      # GitHub Actions secret and in any external cron's X-Cron-Secret header.
      - key: CRON_SECRET
        sync: false
      # Frontend origin(s) for CORS — set once the frontend is deployed.
      # Comma-separated, e.g. https://ayuvo.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Outbound email for password reset links.
      # BREVO_API_KEY is the one that matters here: this service is on the FREE
      # plan, and Render blocks outbound SMTP (ports 25/465/587) on free web
      # services, so the SMTP_* path below can only ever time out in this
      # deploy. Brevo sends over HTTPS instead. See:
      # https://render.com/changelog/free-web-services-will-no-longer-allow-outbound-traffic-to-smtp-ports
      # The SMTP_* vars are kept for local dev and in case this moves to a paid
      # instance, where they start working again.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      # 587 = STARTTLS, which app/core/email.py uses. Not a secret, so it's
      # committed here rather than set in the dashboard.
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Base URL the reset links point at (the deployed frontend).
      - key: FRONTEND_URL
        sync: false
      # Caretaker links: lets a patient grant another account medicine access
      # and reminder delivery via a short-lived code. Enabled 2026-08-03, after
      # scripts/migrate_schema.py was applied to the production database and
      # existing medicine/timeline reads were confirmed unaffected.
      # Set to "false" to withdraw the feature: the care routes 404 and reminder
      # fan-out collapses to patient-only. Existing links are preserved, not
      # deleted, so re-enabling restores them.
      - key: CARETAKER_ENABLED
        value: "true"
      # Firebase Cloud Messaging — path to the service-account JSON inside the
      # Docker image. The file is COPYed by the Dockerfile; this just tells the
      # Python code where to find it. Add this key by hand in the Render
      # dashboard too (see comment at top of file).
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: "serviceAccountKey.json"