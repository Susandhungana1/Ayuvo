# Render Blueprint for the MediStore backend (FastAPI).
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this repo to GitHub (already on origin: Susandhungana1/Medicare).
#   2. On render.com: New > Blueprint > pick this repo. Render reads this file.
#   3. Fill the secret env vars marked `sync: false` (they are NOT in git).
#
# The free plan gives HTTPS + a *.onrender.com domain automatically. Free web
# services sleep after ~15 min idle (cold start on next request) — fine for a
# pilot; upgrade to keep it warm.
services:
  - type: web
    name: medistore-api
    # Docker runtime so the image can install the `tesseract` OCR binary that
    # pytesseract needs (the native python runtime can't apt-install it, which
    # broke image/scanned-PDF report extraction in prod). Build + start come
    # from server/Dockerfile, so no build/startCommand here.
    runtime: docker
    plan: free
    region: singapore          # closest Render region to Nepal / ap-northeast
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Non-secret config — safe to keep in git.
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: medistore-files
      - key: S3_REGION
        value: ap-northeast-1
      - key: S3_ENDPOINT_URL
        value: https://xifuewqueggghsdipmgf.storage.supabase.co/storage/v1/s3
      # Secrets — set these in the Render dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Web Push (medicine reminders when the app is closed).
      # The PUBLIC key is not a secret — browsers receive it — so it's committed
      # here; this also guarantees it matches the private key. Set the matching
      # VAPID_PRIVATE_KEY in the dashboard (sync:false). To rotate, regenerate a
      # pair (`npx web-push generate-vapid-keys`) and update BOTH together.
      # NOTE: the free plan sleeps after ~15 min idle and the in-process reminder
      # scheduler sleeps with it. To deliver reliably anyway, set CRON_SECRET
      # (below) and have a cron POST /api/push/run-tick every minute — that wakes
      # the instance AND flushes due reminders. The keep-alive GitHub Action
      # (.github/workflows/keepalive.yml) does this every 5 min out of the box;
      # add a free cron-job.org / UptimeRobot hit at 1 min for minute accuracy.
      - key: VAPID_PUBLIC_KEY
        value: BERDuKJaoYAjfFSDTLbMLztfcx59zTeDZUYo6tu9T04BuPtcNn2b7JR0aCpZ0fkKq4cyiEVimBYFqLvBaFXbpgw
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@medistore.app
      # Shared secret guarding POST /api/push/run-tick (external reminder cron).
      # Generate any long random string; set the SAME value as the CRON_SECRET
      # GitHub Actions secret and in any external cron's X-Cron-Secret header.
      - key: CRON_SECRET
        sync: false
      # Frontend origin(s) for CORS — set once the frontend is deployed.
      # Comma-separated, e.g. https://medistore.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Outbound email for password reset links. Any SMTP provider works
      # (Gmail app password, Brevo, Mailgun...). If SMTP_HOST is unset the
      # server logs the reset email instead of sending it.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Base URL the reset links point at (the deployed frontend).
      - key: FRONTEND_URL
        sync: false